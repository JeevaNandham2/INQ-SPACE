<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta property="og:site_name" content="INQ SPACE" />

    <meta property="og:description" content="We don’t just design buildings — we capture spaces. A Chennai-based architecture and design studio." />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:image" content="%VITE_SITE_URL%/og-inqspace-logo.png" />
    <meta property="og:image:secure_url" content="%VITE_SITE_URL%/og-inqspace-logo.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="INQ SPACE — Architecture + Design logo" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="INQ SPACE — Architecture / Interiors / Execution" />
    <meta name="twitter:description" content="We don’t just design buildings — we capture spaces. A Chennai-based architecture and design studio." />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og-inqspace-logo.png" />
    <link rel="preconnect" href="https://images.unsplash.com" />
    <link rel="preload" as="image" href="/brand/inq-logo.png" />
    <link rel="preload" as="image" href="/media/hero-main.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <title>INQ SPACE — Architects &amp; Interior Designers in Chennai</title>
    <link rel="canonical" href="%VITE_SITE_URL%/" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="author" content="INQ SPACE (OPC) Pvt. Ltd." />
    <meta property="og:locale" content="en_IN" />
    <!-- business details for Google (name, address, phone, services) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "@id": "%VITE_SITE_URL%/#studio",
        "name": "INQ SPACE",
        "legalName": "INQ SPACE (OPC) Pvt. Ltd.",
        "description": "Chennai-based architecture and design studio led by Architect Ajeeth Elancheziyan — architecture, interior design, design + execution and design consultancy.",
        "url": "%VITE_SITE_URL%/",
        "logo": "%VITE_SITE_URL%/brand/inq-logo.png",
        "image": "%VITE_SITE_URL%/og-inqspace-logo.png",
        "telephone": "+91-72996-75654",
        "email": "inqyourspace@gmail.com",
        "founder": { "@type": "Person", "name": "Ajeeth Elancheziyan", "jobTitle": "Principal Architect" },
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "#1/37, School Street, Soorapattu",
          "addressLocality": "Chennai",
          "addressRegion": "Tamil Nadu",
          "postalCode": "600066",
          "addressCountry": "IN"
        },
        "areaServed": ["Chennai", "Tamil Nadu"],
        "knowsAbout": ["Architecture", "Interior Design", "Residential Architecture", "Space Planning", "Design and Execution", "Design Consultancy"]
      }
    </script>
    <!-- splash: inline so it paints before any JavaScript arrives; src/splash.js removes it -->
    <style>
      .is-loading { overflow: hidden; }
      #splash {
        position: fixed; inset: 0; z-index: 1000; display: grid; place-items: center;
        overflow: hidden; clip-path: inset(0 0 0 0);
        background: radial-gradient(ellipse at center, #fdfdfb 0%, #f8f7f4 55%, #efede8 100%);
        transition: clip-path 0.95s cubic-bezier(0.76, 0, 0.24, 1), visibility 0.95s;
      }
      #splash.is-done { clip-path: inset(0 0 100% 0); visibility: hidden; }
      #splash.is-done .splash-frame { opacity: 0; transform: translateY(-40px); }
      /* drafting guides that frame the logo, then corner crop marks */
      .splash-frame { position: relative; padding: 38px 48px; transition: opacity 0.5s ease, transform 0.8s cubic-bezier(0.76, 0, 0.24, 1); }
      .sg { position: absolute; background: rgba(19, 38, 58, 0.11); }
      .sg-h { left: -100vw; right: -100vw; height: 1px; animation: sp-guide-x 1.1s cubic-bezier(0.65, 0, 0.35, 1) both; }
      .sg-v { top: -100vh; bottom: -100vh; width: 1px; animation: sp-guide-y 1.1s 0.12s cubic-bezier(0.65, 0, 0.35, 1) both; }
      .sg-t { top: 0; } .sg-b { bottom: 0; animation-delay: 0.08s; } .sg-l { left: 0; } .sg-r { right: 0; animation-delay: 0.2s; }
      .sc { position: absolute; width: 18px; height: 18px; border: 0 solid #1b2c3a; animation: sp-corner 0.6s 0.55s cubic-bezier(0.22, 1, 0.36, 1) both; }
      .sc-tl { top: -6px; left: -6px; border-top-width: 2px; border-left-width: 2px; --dx: -14px; --dy: -14px; }
      .sc-tr { top: -6px; right: -6px; border-top-width: 2px; border-right-width: 2px; --dx: 14px; --dy: -14px; }
      .sc-bl { bottom: -6px; left: -6px; border-bottom-width: 2px; border-left-width: 2px; --dx: -14px; --dy: 14px; border-color: #af1117; }
      .sc-br { bottom: -6px; right: -6px; border-bottom-width: 2px; border-right-width: 2px; --dx: 14px; --dy: 14px; border-color: #af1117; }
      /* light sheen that sweeps across the finished logo */
      .splash-inner::after {
        content: ''; position: absolute; inset: -10px -20px; pointer-events: none; mix-blend-mode: soft-light;
        background: linear-gradient(105deg, transparent 38%, rgba(255, 255, 255, 0.95) 50%, transparent 62%) no-repeat;
        background-size: 250% 100%; background-position: 130% 0; animation: sp-sheen 0.9s 2.05s ease-in-out both;
      }
      .splash-inner {
        position: relative; display: block; color: #1b2c3a;
      }
      /* scales with the screen; the artwork is revealed top-down, like a drawing being inked */
      .splash-mark {
        display: block; height: clamp(200px, min(40vh, 64vw), 340px); width: auto;
        animation: sp-ink 1.6s 0.35s cubic-bezier(0.65, 0, 0.35, 1) both, sp-settle 1.6s 0.35s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      @keyframes sp-ink { from { clip-path: inset(0 0 100% 0); } to { clip-path: inset(0 0 0 0); } }
      @keyframes sp-settle { from { opacity: 0.2; transform: translateY(18px) scale(0.97); } to { opacity: 1; transform: none; } }
      @keyframes sp-guide-x { from { transform: scaleX(0); } to { transform: none; } }
      @keyframes sp-guide-y { from { transform: scaleY(0); } to { transform: none; } }
      @keyframes sp-corner { from { opacity: 0; transform: translate(var(--dx), var(--dy)); } to { opacity: 1; transform: none; } }
      @keyframes sp-sheen { from { background-position: 130% 0; } to { background-position: -30% 0; } }
      @keyframes sp-drop { from { opacity: 0; transform: translateY(-35%); } to { opacity: 1; transform: none; } }
      @keyframes sp-wipe-down { from { clip-path: inset(0 0 100% 0); } to { clip-path: inset(0 0 0 0); } }
      @keyframes sp-grow { from { opacity: 0; transform: scale(0); } to { opacity: 1; transform: none; } }
      @keyframes sp-pop { from { opacity: 0; transform: scale(0); } to { opacity: 1; transform: none; } }
      @keyframes sp-line { from { transform: scaleX(0); } to { transform: none; } }
      @keyframes sp-rise { from { opacity: 0; transform: translateY(70px); } to { opacity: 1; transform: none; } }
      @keyframes sp-fade { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: none; } }
      @media (max-width: 600px) {

        .splash-frame { padding: 26px 24px; }
        .sc { width: 13px; height: 13px; }
          }
      @media (prefers-reduced-motion: reduce) {
        #splash *, #splash *::before, #splash *::after { animation: none !important; }
        #splash, .splash-frame { transition-duration: 0.3s; }
      }
    </style>
  </head>
  <body class="is-loading">
    <div id="splash" role="status" aria-label="Loading INQ SPACE">
      <div class="splash-frame" aria-hidden="true">
      <span class="sg sg-h sg-t"></span><span class="sg sg-h sg-b"></span>
      <span class="sg sg-v sg-l"></span><span class="sg sg-v sg-r"></span>
      <span class="sc sc-tl"></span><span class="sc sc-tr"></span><span class="sc sc-bl"></span><span class="sc sc-br"></span>
      <div class="splash-inner">
        <img class="splash-mark" src="/brand/inq-logo.png" alt="" width="692" height="1068" />
      </div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
